<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" />
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <title>Book Appoinment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
    <link rel="stylesheet" href="../css/index.css" />
</head>

<body>
    <div class="container">
        <div id="header-container"></div>
        <div id="appointment-container">
            <div class="d-flex justify-content-center p-3">
                <h3>Book Appoinment</h3>
            </div>
            <div>
                <div class="d-flex justify-content-center p-3">
                    <span class="p-3">
                        <button type="button" id="speciality-btn" class="btn btn-outline-primary">
                            Speciality
                        </button>
                    </span>
                    <span class="p-3">
                        <button type="button" id="doctors-btn" class="btn btn-outline-primary">
                            Doctor
                        </button>
                    </span>
                </div>
                <form id="appointment-form">
                    <!-- step-1 -->
                    <div class="form-step">
                        <div id="speciality-list" class="row row-cols-1 row-cols-md-3 g-4"></div>
                    </div>
                    <!-- step-2 -->
                    <div class="form-step d-none">
                        <div id="doctors-list" class="row row-cols-1 row-cols-md-3 g-4"></div>
                    </div>
                    <!-- step-3 -->
                    <div class="form-step d-none">
                        <div id="slots-list" class="row row-cols-1 row-cols-md-3 g-4"></div>
                    </div>
                    <!-- step-4 -->
                    <div class="form-step d-none">
                        <div>
                            <input id="search-input" type="text" placeholder="Search" />
                        </div>
                        <div class="" id="patients-list"></div>

                        <div class="flex justify-end mt-4">
                            <button type="submit" class="btn-success border-0 p-2" id="submit-btn">
                                Submit
                            </button>
                        </div>
                    </div>
                    <!-- Navigation Buttons -->
                    <div class="my-4">
                        <button class="btn btn-outline-primary" type="button" id="prev-btn" disabled>Prev</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <footer class="bg-black text-white py-4">
        <div class="container d-flex align-items-center justify-content-between">
            <span>&copy; 2024 Hospital Tech Solutions. All rights reserved.</span>
            <span>
                <a href="#">Privacy Policy</a> | <a href="#">Terms of Service</a>
            </span>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <!-- <script>
        document.getElementById("year").textContent = new Date().getFullYear();
    </script> -->
    <script src="../js/dateTime.js"></script>
    <script type="module" src="../js/bookAppointment.js"></script>
</body>

</html>

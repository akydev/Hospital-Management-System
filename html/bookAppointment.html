<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" />
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <title>Book Appoinment</title>
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
    <link rel="stylesheet" href="../css/index.css" />
</head>

<body>
    <div class="container">
        <div id="header-container"></div>

        <div id="appointment-container">
            <div class="d-flex justify-content-center p-3 ">
                <h3>Book Appoinment</h3>
            </div>
            <div>
                <div class="d-flex justify-content-center p-3 ">
                    <button type="button" id="speciality-btn" class="btn btn-outline-primary">Speciality</button>
                    <button type="button" id="doctors-btn" class="btn btn-outline-primary">Doctor</button>
                </div>


                <form id="appointment-form">
                    <!-- step-1 -->
                    <div class="form-step">
                        <div id="speciality-list" class="row row-cols-1 row-cols-md-3 g-4"></div>
                    </div>
                    <!-- step-2 -->
                    <div class="form-step d-none">
                        <div id="doctors-list" class="row row-cols-1 row-cols-md-3 g-4"></div>
                    </div>
                    <!-- step-3 -->
                    <div class="form-step d-none">
                        <div id="slots-list" class="row row-cols-1 row-cols-md-3 g-4"></div>
                    </div>
                    <!-- step-4 -->
                    <div class="form-step d-none">
                        <input type="text" placeholder="something" />
                        <button id="submit-btn" type="submit">Submit</button>
                    </div>
                    <!-- Navigation Buttons -->
                    <div>
                        <button type="button" id="prev-btn" disabled>
                            Prev
                        </button>
                    </div>
                </form>

            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-4">
        <div class="container">
            <p>&copy; 2024 Hospital Tech Solutions. All rights reserved.</p>
            <a href="#" class="text-white">Privacy Policy</a> |
            <a href="#" class="text-white">Terms of Service</a>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script type="module" src="../js/bookAppointment.js"></script>
</body>

</html>

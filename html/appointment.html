<head>

        </div>

        <div class="row row-cols-1 row-cols-md-3 g-4">

                <div class="card h-100">
                    <img src="..." class="card-img-top" alt="...">

                        <h5 class="card-title">Patient: Patient Name</h5>
                        <p class="card-text">Specialization</p>
                        <p class="card-text">Appoinment Time</p>
                    </div>
                    <div class="card-footer">
                        <small class="text-body-secondary">Booked 3 mins ago</small>
                    </div>
                </div>
            </div>

        </div>
    </div>

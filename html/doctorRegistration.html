<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">

      rel="stylesheet"
      type="text/css"

    />

      type="text/javascript"
      src="https://cdn.jsdelivr.net/npm/toastify-js"
    ></script>
    <!-- Custom CSS -->
    <style>
        body {
            background: #e9ecef;
            display: flex;
            align-items: center;
            justify-content: center;

        }

            max-width: 600px;
            width: 100%;
            padding: 2rem;
        }
        .card {
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
        }
        .btn-primary:hover {
            background-color: #0056b3;

        }
        .btn-secondary {
            background-color: #6c757d;
            border-color: #6c757d;
        }
        .btn-secondary:hover {
            background-color: #5a6268;
            border-color: #545b62;
        }
        .form-group label {
            font-weight: 500;
        }
        .form-control {
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <a class="navbar-brand" href="#">Hospital Tech Solutions</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <a class="nav-link" href="../html/index.html">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Services</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="../html/aboutUs.html">About Us</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="../html/contact.html">Contact</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="../html/login.html">Login</a>
                </li>
                <li class="nav-item dropdown active mx-3">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        Register
                    </a>
                    <ul class="dropdown-menu">
                      <li><a class="dropdown-item" href="../html/patientRegistration.html">Patient Registration</a></li>
                      <li><hr class="dropdown-divider"></li>
                      <li><a class="dropdown-item" href="../html/doctorRegistration.html">Doctor Registration</a></li>
                    </ul>
                  </li>
                  <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
                    <button class="btn btn-outline-success" type="submit">Search</button>
                  </form>
            </ul>
        </div>
    </nav>

    <div class="card-container">
        <div class="card">
            <div class="card-body">
                <h1 class="text-center">Doctor Registration</h1>
                <form id="registrationForm">
                    <!-- Step 1 -->
                    <div class="form-step active">
                        <h3>Step 1: Personal Information</h3>
                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <label for="firstName">First Name</label>
                                <input type="text" name="firstName" class="form-control" id="firstName" placeholder="John">
                                <span class="text-danger" id="error-firstName"></span>
                            </div>
                            <div class="form-group col-md-6">
                                <label for="lastName">Last Name</label>
                                <input type="text" name="lastName" class="form-control" id="lastName" placeholder="Doe">
                                <span class="text-danger" id="error-lastName"></span>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="email">Email address</label>
                            <input type="email" name="email" class="form-control" id="email" placeholder="john.doe@example.com">
                            <span class="text-danger" id="error-email"></span>
                        </div>
                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" name="password" class="form-control" id="password" placeholder="Password">
                            <span class="text-danger" id="error-password"></span>
                        </div>
                        <div class="form-group">
                            <label for="confirmPassword">Confirm Password</label>
                            <input type="password" name="confirmPassword" class="form-control" id="confirmPassword" placeholder="Password">
                            <span class="text-danger" id="error-confirmPassword"></span>
                        </div>

                        <div class="form-group">
                            <label for="phone">Phone Number</label>
                            <input type="tel" name="phone" class="form-control" id="phone" placeholder="(123) 456-7890">
                            <span class="text-danger" id="error-phone"></span>
                        </div>
                        <!-- <h3>Step 3: Date of Birth</h3> -->
                        <div class="form-group">
                            <label for="dob">Date of Birth</label>
                            <input type="date" name="dob" class="form-control" id="dob">
                            <span class="text-danger" id="error-dob"></span>
                        </div>
                        <div class="form-row">
                            <div class="form-group form-check form-check-inline col-md-6">
                                <label for="gender" class="m-3">Gender</label>
                                <input type="radio" name="gender" class="form-control m-3 form-check-input" id="male" value="male" style="width: 18px; display:18px;">
                                <label for="male" class="form-check-label m-3">Male</label>
                                <input type="radio" name="gender" class="form-control m-3 form-check-input" id="female" value="female" style="width: 18px; display:18px;">
                                <label for="female" class="form-check-label m-3">Female</label>
                                <span class="text-danger" id="error-gender"></span>
                            </div>
                        </div>
                        <button type="button" id="nextStep" class="btn btn-primary btn-block">Next</button>
                    </div>
                    
                    <!-- Step 2 -->
                    <div class="form-step d-none">
                        <h3>Step 2: Professional Details</h3>
                        <div class="form-group">
                            <!-- <label for="specialty">Specialty</label>
                            <input type="text" name="specialty" class="form-control" id="specialty" placeholder="Cardiology">
                            <span class="text-danger" id="error-specialty"></span> -->
                            <select  class="form-select" name="specializationId" id="specialization">
                               
                            </select>
                            <span class="text-danger" id="error-specializationId"></span>
                        </div>
                        <div class="form-group">
                            <label for="licenseNumber">Medical License Number</label>
                            <input type="text" name="licenseNumber" class="form-control" id="licenseNumber" placeholder="ABC123456">
                            <span class="text-danger" id="error-licenseNumber"></span>
                        </div>
                        <div class="form-group col-md-6">
                            <label for="experience">Experience</label>
                            <input type="text" name="experience" class="form-control" id="experience" placeholder="Enter your experience">
                            <span class="text-danger" id="error-experience"></span>
                        </div>
                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <button type="button" id="prevStep" class="btn btn-secondary btn-block">Previous</button>
                            </div>
                            <div class="form-group col-md-6">
                                <button type="button" id="nextStep" class="btn btn-primary btn-block">Next</button>
                            </div>
                        </div>
                    </div>

                    <!-- Step 3 -->
                    <div class="form-step d-none">
                        <h3>Step 3: Address Information</h3>
                        <div class="form-group">
                            <label for="address">Address</label>
                            <input type="text" name="addressLine" class="form-control" id="addressLine" placeholder="123 Main St, Apt 4B">
                            <span class="text-danger" id="error-addressLine"></span>
                        </div>
                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <label for="city">City</label>
                                <input type="text" name="city" class="form-control" id="city" placeholder="New York">
                                <span class="text-danger" id="error-city"></span>
                            </div>
                            <div class="form-group col-md-6">
                                <label for="state">State</label>
                                <input type="text" name="state" class="form-control" id="state" placeholder="NY">
                                <span class="text-danger" id="error-state"></span>
                            </div>
                        </div>
                        <div class="form-group col-md-6">
                            <label for="country">Country</label>
                            <input type="text" name="country" class="form-control" id="country" placeholder="India">
                            <span class="text-danger" id="error-country"></span>
                        </div>
                        <div class="form-group">
                            <label for="zip">Zip Code</label>
                            <input type="text" name="pincode" class="form-control" id="pincode" placeholder="10001">
                            <span class="text-danger" id="error-pincode"></span>
                        </div>
                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <button type="button" id="prevStep" class="btn btn-secondary btn-block">Previous</button>
                            </div>
                            <div class="form-group col-md-6">
                                <button type="submit" class="btn btn-primary btn-block">Register</button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS and dependencies -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>

    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <!-- Custom JS -->
    <script type="module" src="../js/doctorRegistration.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Registration</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" />
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <!-- Custom CSS -->
    <style>
        body {
            background: #e9ecef;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .card-container {
            max-width: 600px;
            width: 100%;
            padding: 2rem;
        }

        .card {
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
        }

        .btn-primary:hover {
            background-color: #0056b3;
            border-color: #004085;
        }

        .btn-secondary {
            background-color: #6c757d;
            border-color: #6c757d;
        }

        .btn-secondary:hover {
            background-color: #5a6268;
            border-color: #545b62;
        }

        .form-group label {
            font-weight: 500;
        }

        .form-control {
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <!--  Navbar -->
    <div class="d-flex flex-column h-100 w-100">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Hospital Tech Solutions</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                        <li class="nav-item active">
                            <a class="nav-link" href="../html/index.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Services</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="../html/aboutUs.html">About Us</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="../html/contact.html">Contact</a>
                        </li>
                    </ul>

                    <div class="d-flex">
                        <ul class="navbar-nav">
                            <li class="nav-item dropdown mx-3">
                                <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                                    aria-expanded="false">
                                    Register
                                </a>
                                <ul class="dropdown-menu">
                                    <li><a class="dropdown-item" href="../html/patientRegistration.html">Patient
                                            Registration</a>
                                    </li>
                                    <li>
                                        <hr class="dropdown-divider">
                                    </li>
                                    <li><a class="dropdown-item" href="../html/doctorRegistration.html">Doctor
                                            Registration</a>
                                    </li>
                                </ul>
                            </li>
                        </ul>
                        <a href="../html/login.html">
                            <button class="btn btn-primary" type="button">Login</button>
                        </a>
                    </div>
                </div>
            </div>
        </nav>

        <div class="card-container mx-auto">
            <div class="card">
                <div class="card-body">
                    <h1 class="text-center">Doctor Registration</h1>
                    <form id="registrationForm">
                        <!-- Step 1 -->
                        <div class="form-step active">
                            <h3>Step 1: Personal Information</h3>
                            <div class="row g-2 mb-2">
                                <div class="form-group col-md-6">
                                    <label for="firstName" class="pb-2">First Name</label>
                                    <input type="text" name="firstName" class="form-control" id="firstName"
                                        placeholder="John" />
                                    <span class="text-danger" id="error-firstName"></span>
                                </div>
                                <div class="form-group col-md-6">
                                    <label for="lastName" class="pb-2">Last Name</label>
                                    <input type="text" name="lastName" class="form-control" id="lastName"
                                        placeholder="Doe" />
                                    <span class="text-danger" id="error-lastName"></span>
                                </div>
                            </div>
                            <div class="form-group mb-2">
                                <label for="email" class="pb-2">Email address</label>
                                <input type="email" name="email" class="form-control" id="email"
                                    placeholder="john.doe@example.com">
                                <span class="text-danger" id="error-email"></span>
                            </div>
                            <div class="row g-2 mb-2">
                                <div class="form-group col-md-6">
                                    <label for="password" class="pb-2">Password</label>
                                    <input type="password" name="password" class="form-control" id="password"
                                        placeholder="Password">
                                    <span class="text-danger" id="error-password"></span>
                                </div>
                                <div class="form-group col-md-6">
                                    <label for="confirmPassword" class="pb-2">Confirm Password</label>
                                    <input type="password" name="confirmPassword" class="form-control"
                                        id="confirmPassword" placeholder="Password">
                                    <span class="text-danger" id="error-confirmPassword"></span>
                                </div>
                            </div>
                            <div class="row g-2 mb-2">
                                <div class="form-group col-md-6">
                                    <label for="phone" class="pb-2">Phone Number</label>
                                    <input type="tel" name="phone" class="form-control" id="phone"
                                        placeholder="(123) 456-7890">
                                    <span class="text-danger" id="error-phone"></span>
                                </div>
                                <div class="form-group col-md-6">
                                    <label for="dob" class="pb-2">Date of Birth</label>
                                    <input type="date" name="dob" class="form-control" id="dob">
                                    <span class="text-danger" id="error-dob"></span>
                                </div>
                            </div>
                            <div class="form-group mb-2">
                                <label for="gender" class="pb-2">Gender</label>
                                <div class="d-flex gap-3">
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="gender" id="male"
                                            value="male">
                                        <label class="form-check-label" for="flexRadioDefault1">
                                            Male
                                        </label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="gender" id="female"
                                            value="female">
                                        <label class="form-check-label" for="flexRadioDefault2">
                                            Female
                                        </label>
                                    </div>
                                    <span class="text-danger" id="error-gender"></span>
                                </div>

                            </div>
                            <button type="button" id="nextStep" class="btn btn-primary btn-block">Next</button>
                        </div>

                        <!-- Step 2 -->
                        <div class="form-step d-none">
                            <h3>Step 2: Professional Details</h3>
                            <div class="form-group mb-2">
                                <select class="form-select" name="specializationId" id="specialization">
                                </select>
                                <span class="text-danger" id="error-specializationId"></span>
                            </div>
                            <div class="form-group mb-2">
                                <label for="licenseNumber" class="pb-2">Medical License Number</label>
                                <input type="text" name="licenseNumber" class="form-control" id="licenseNumber"
                                    placeholder="ABC123456">
                                <span class="text-danger" id="error-licenseNumber"></span>
                            </div>
                            <div class="form-group mb-2">
                                <label for="experience" class="pb-2">Experience</label>
                                <input type="text" name="experience" class="form-control" id="experience"
                                    placeholder="Enter your experience">
                                <span class="text-danger" id="error-experience"></span>
                            </div>
                            <div class="d-flex justify-content-between">
                                <button type="button" id="prevStep"
                                    class="btn btn-secondary btn-block">Previous</button>
                                <button type="button" id="nextStep" class="btn btn-primary btn-block">Next</button>
                            </div>
                        </div>

                        <!-- Step 3 -->
                        <div class="form-step d-none">
                            <h3>Step 3: Address Information</h3>
                            <div class="form-group mb-2">
                                <label for="address" class="pb-2">Address</label>
                                <input type="text" name="addressLine" class="form-control" id="addressLine"
                                    placeholder="123 Main St, Apt 4B">
                                <span class="text-danger" id="error-addressLine"></span>
                            </div>
                            <div class="row g-2 mb-2">
                                <div class="form-group col-md-6">
                                    <label for="city" class="pb-2">City</label>
                                    <input type="text" name="city" class="form-control" id="city"
                                        placeholder="New York">
                                    <span class="text-danger" id="error-city"></span>
                                </div>
                                <div class="form-group col-md-6">
                                    <label for="state" class="pb-2">State</label>
                                    <input type="text" name="state" class="form-control" id="state" placeholder="NY">
                                    <span class="text-danger" id="error-state"></span>
                                </div>
                            </div>
                            <div class="row g-2 mb-2">
                                <div class="form-group col-md-6">
                                    <label for="country" class="pb-2">Country</label>
                                    <input type="text" name="country" class="form-control" id="country"
                                        placeholder="India">
                                    <span class="text-danger" id="error-country"></span>
                                </div>
                                <div class="form-group col-md-6">
                                    <label for="zip" class="pb-2">Zip Code</label>
                                    <input type="text" name="pincode" class="form-control" id="pincode"
                                        placeholder="10001">
                                    <span class="text-danger" id="error-pincode"></span>
                                </div>
                            </div>
                            <div class="d-flex justify-content-between">
                                <button type="button" id="prevStep"
                                    class="btn btn-secondary btn-block">Previous</button>
                                <button type="submit" class="btn btn-primary btn-block">Register</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <!-- Bootstrap JS and dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <!-- Custom JS -->
    <script type="module" src="../js/doctorRegistration.js"></script>
</body>

</html>

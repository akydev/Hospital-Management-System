<form id="profileForm">
    <!-- Step 1 -->
    <div class="form-step active">
        <h3 class="my-5">Personal Information</h3>
        <div class="form-row">
            <div class="form-group col-md-6">
                <label for="firstName">First Name</label>
                <input type="text" name="firstName" class="form-control" id="firstName" placeholder="John">
                <span class="text-danger" id="error-firstName"></span>
            </div>
            <div class="form-group col-md-6">
                <label for="lastName">Last Name</label>
                <input type="text" name="lastName" class="form-control" id="lastName" placeholder="Doe">
                <span class="text-danger" id="error-lastName"></span>
            </div>
        </div>
        <div class="form-group">
            <label for="email">Email address</label>
            <input type="email" name="email" class="form-control" id="email" placeholder="john.doe@example.com"
                disabled>
            <span class="text-danger" id="error-email"></span>
        </div>

        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" name="phone" class="form-control" id="phone" placeholder="(123) 456-7890">
            <span class="text-danger" id="error-phone"></span>
        </div>
        <h3>Address Information</h3>
        <div class="form-step">
            <h3>Address Information</h3>
            <div class="form-group">
                <label for="address">Address</label>
                <input type="text" name="fullAddress.addressLine" class="form-control" id="addressLine"
                    placeholder="123 Main St, Apt 4B">
                <span class="text-danger" id="error-addressLine"></span>
            </div>
            <div class="form-row">
                <div class="form-group col-md-6">
                    <label for="city">City</label>
                    <input type="text" name="fullAddress.city" class="form-control" id="city" placeholder="New York">
                    <span class="text-danger" id="error-city"></span>
                </div>
                <div class="form-group col-md-6">
                    <label for="state">State</label>
                    <input type="text" name="fullAddress.state" class="form-control" id="state" placeholder="NY">
                    <span class="text-danger" id="error-state"></span>
                </div>
            </div>
            <div class="form-group col-md-6">
                <label for="country">Country</label>
                <input type="text" name="fullAddress.country" class="form-control" id="country" placeholder="India">
                <span class="text-danger" id="error-country"></span>
            </div>
            <div class="form-group">
                <label for="zip">Zip Code</label>
                <input type="text" name="fullAddress.pincode" class="form-control" id="pincode" placeholder="10001">
                <span class="text-danger" id="error-pincode"></span>
            </div>
        </div>
        <h3>Date of Birth</h3>
        <div class="form-group">
            <label for="dob">Date of Birth</label>
            <input type="date" name="dob" class="form-control" id="dob" disabled>
            <span class="text-danger" id="error-dob"></span>
        </div>
        <div class="form-row">
            <div class="form-group form-check form-check-inline col-md-6">
                <label for="gender" class="m-3">Gender</label>
                <input type="radio" name="gender" class="form-control m-3 form-check-input" id="male" value="male"
                    style="width: 18px; display:18px;">
                <label for="male" class="form-check-label m-3">Male</label>
                <input type="radio" name="gender" class="form-control m-3 form-check-input" id="female" value="female"
                    style="width: 18px; display:18px;">
                <label for="female" class="form-check-label m-3">Female</label>
                <span class="text-danger" id="error-gender"></span>
            </div>
        </div>
    </div>


    <div class="text-center mb-5">
        <a href="#" class="btn btn-primary">Edit Profile</a>
    </div>
</form>

</div>
</div>

<div id="doctorProfile">
    <div class="profile-card">
        <form id="profileForm">
            <!-- Step 1 -->
            <div class="form-step active">
                <h3 class="my-3 text-center">Profile Information</h3>
                <h3>Personal Information</h3>
                <div class="row g-2 mb-2">
                    <div class="form-group col-md-6">
                        <label for="firstName" class="pb-2">First Name</label>
                        <input type="text" name="firstName" class="form-control" id="firstName" placeholder="John" />
                        <span class="text-danger" id="error-firstName"></span>
                    </div>
                    <div class="form-group col-md-6">
                        <label for="lastName" class="pb-2">Last Name</label>
                        <input type="text" name="lastName" class="form-control" id="lastName" placeholder="Doe" />
                        <span class="text-danger" id="error-lastName"></span>
                    </div>
                </div>

                <div class="form-group mb-2">
                    <label for="phone" class="pb-2">Phone Number</label>
                    <input type="tel" name="phone" class="form-control" id="phone" placeholder="(123) 456-7890" />
                    <span class="text-danger" id="error-phone"></span>
                </div>
            </div>

            <!-- Step 2 -->
            <div class="form-step">
                <h3>Professional Details</h3>
                <div class="row g-2 mb-2">
                    <div class="form-group col-md-6">
                        <label for="licenseNumber" class="pb-2">Medical License Number</label>
                        <input type="text" name="licenseNumber" class="form-control" id="licenseNumber"
                            placeholder="ABC123456" />
                        <span class="text-danger" id="error-licenseNumber"></span>
                    </div>
                    <div class="form-group col-md-6">
                        <label for="experience" class="pb-2">Experience</label>
                        <input type="text" name="experience" class="form-control" id="experience"
                            placeholder="Enter your experience" />
                        <span class="text-danger" id="error-experience"></span>
                    </div>
                </div>
            </div>

            <!-- Step 3 -->
            <div class="form-step">
                <h3>Address Information</h3>
                <div class="form-group mb-2">
                    <label for="address" class="pb-2">Address</label>
                    <input type="text" name="fullAddress.addressLine" class="form-control" id="addressLine"
                        placeholder="123 Main St, Apt 4B">
                    <span class="text-danger" id="error-addressLine"></span>
                </div>
                <div class="row g-2 mb-2">
                    <div class="form-group col-md-6">
                        <label for="city" class="pb-2">City</label>
                        <input type="text" name="fullAddress.city" class="form-control" id="city"
                            placeholder="New York">
                        <span class="text-danger" id="error-city"></span>
                    </div>
                    <div class="form-group col-md-6">
                        <label for="state" class="pb-2">State</label>
                        <input type="text" name="fullAddress.state" class="form-control" id="state" placeholder="NY">
                        <span class="text-danger" id="error-state"></span>
                    </div>
                </div>
                <div class="row g-2 mb-2">
                    <div class="form-group col-md-6">
                        <label for="country" class="pb-2">Country</label>
                        <input type="text" name="fullAddress.country" class="form-control" id="country"
                            placeholder="India">
                        <span class="text-danger" id="error-country"></span>
                    </div>
                    <div class="form-group col-md-6">
                        <label for="zip" class="pb-2">Zip Code</label>
                        <input type="text" name="fullAddress.pincode" class="form-control" id="pincode"
                            placeholder="10001">
                        <span class="text-danger" id="error-pincode"></span>
                    </div>
                </div>
            </div>
            <div class="text-center  my-5">
                <button type="submit" class="btn btn-primary">Edit Profile</button>
            </div>
    </div>
    </form>
</div>
</div>
